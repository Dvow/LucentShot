[package]
name = "lightshotv2"
version = "0.1.0"
edition = "2021"
build = "build.rs"

[package.metadata.winres]
FileDescription = "Lightshot Clone - Screenshot tool"
ProductName = "Lightshot Clone"
CompanyName = "Lightshot Clone"
OriginalFilename = "lightshotv2.exe"
LegalCopyright = "Copyright (C) 2025"

[profile.release]
strip = true
lto = "thin"
codegen-units = 1
debug = false

[dependencies]
eframe = "0.27"
image = "0.24"
reqwest = { version = "0.12", features = ["json", "multipart", "blocking"] }
anyhow = "1.0"
imageproc = "0.23"
rusttype = "0.9"
egui_nerdfonts = "0.1"
serde_json = "1.0"
windows = { version = "0.56", features = ["Win32_UI_Shell", "Win32_UI_Shell_Common", "Win32_UI_Shell_PropertiesSystem", "Win32_UI_Controls_Dialogs", "Win32_Foundation", "Win32_System_Com", "Win32_System_Ole", "Win32_System_Threading", "Win32_Security", "Win32_System_DataExchange", "Win32_System_Memory", "Win32_UI_WindowsAndMessaging", "Win32_Graphics_Printing", "Win32_Graphics_Gdi", "Win32_Graphics_Dwm", "Win32_UI_Input_KeyboardAndMouse", "Win32_System_Registry", "Win32_System_Variant"] }
tiny-skia = "0.11"
tray-icon = "0.14"
serde = { version = "1.0.228", features = ["derive"] }
tesseract-static = { version = "0.2", default-features = false }
once_cell = "1.19"
[target.'cfg(windows)'.dependencies]
tauri-winrt-notification = "0.7"

[build-dependencies]
winres = "0.1"
reqwest = { version = "0.12", features = ["blocking"] }
image = "0.24"