[package]
name = "lightshotv2"
version = "0.1.0"
edition = "2021"
build = "build.rs"

[package.metadata.winres]
FileDescription = "Lightshot Clone - Screenshot tool"
ProductName = "Lightshot Clone"
CompanyName = "Lightshot Clone"
OriginalFilename = "lightshotv2.exe"
LegalCopyright = "Copyright (C) 2025"

[features]
default = ["ocr"]
ocr = ["dep:tesseract-static", "dep:tts"]

[profile.release]
strip = true
lto = "fat"
codegen-units = 1
panic = "abort"
opt-level = "z"
debug = false

[dependencies]
arboard = "3.4"
eframe = { version = "0.34", default-features = false, features = ["default_fonts", "glow"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "bmp", "gif", "ico"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "multipart", "blocking", "native-tls"] }
rfd = { version = "0.15", default-features = false }
webbrowser = "1.0"
anyhow = "1.0"
ab_glyph = "0.2"
imageproc = { version = "0.24", default-features = false }
serde_json = "1.0"
tiny-skia = "0.11"
resvg = { version = "0.45", default-features = false }
tray-icon = { version = "0.14", default-features = false }
serde = { version = "1.0.228", features = ["derive"] }
tesseract-static = { version = "0.2", default-features = false, optional = true }
tts = { version = "0.26", default-features = false, optional = true }
dirs = "5.0"
windows = { version = "0.56", features = ["Win32_Foundation", "Win32_System_Threading", "Win32_UI_WindowsAndMessaging", "Win32_Graphics_Gdi", "Win32_Graphics_Dwm", "Win32_UI_Input_KeyboardAndMouse"] }
tauri-winrt-notification = "0.7"
winprint = { version = "0.2", default-features = false }

[patch.crates-io]
tesseract-static = { path = "assets/tesseract-static" }

[build-dependencies]
winres = "0.1"
image = { version = "0.25", default-features = false, features = ["png", "ico"] }